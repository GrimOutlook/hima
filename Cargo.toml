[package]
name = "hima"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[dependencies]
chrono = { version = "0.4.39", features = ["serde"] }
dioxus = { version = "=0.7.10", features = ["web"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Keep the wasm-bindgen family aligned with the CLI packaged by Nixpkgs.
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = ["Storage", "Window"] }
