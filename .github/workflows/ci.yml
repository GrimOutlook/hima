name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend format, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: hima-test
          POSTGRES_DB: hima_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:hima-test@localhost:5432/hima_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --test postgres -- --ignored
      - name: Test signed OIDC, unauthorized access, and concurrent planner saves
        run: cargo test --locked --test auth -- --ignored
      - name: Set up pnpm for proxy integration
        uses: pnpm/action-setup@v4
      - name: Set up Node.js for proxy integration
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Test OIDC and sessions through Vite
        working-directory: .
        run: |
          pnpm run dev > "$RUNNER_TEMP/hima-vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid"' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/hima-vite.log"
            exit 1
          fi
          HIMA_TEST_VITE_PROXY=1 cargo test --locked --manifest-path backend/Cargo.toml --test auth -- --ignored
      - name: Test production HTTPS reverse proxy and restart persistence
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          pnpm run build
          python3 deploy/test_https_proxy.py
      - run: cargo build --release --locked --bins
  packages:
    name: Nix frontend and backend release packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build .#frontend .#backend
  checks:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build
