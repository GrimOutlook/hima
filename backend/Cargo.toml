[package]
name = "hima-api"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "hima-api"

[dependencies]
openidconnect = "4"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
axum = { version = "0.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json", "chrono", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
base64 = "0.22"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
