# Install inside nginx's http context. Replace hima.example and certificate paths.
# Empty keys are not counted, keeping auth and API budgets independent.
map $uri $hima_auth_client {
    default "";
    ~^/auth(/|$) $binary_remote_addr;
}
map $uri $hima_api_client {
    default "";
    ~^/api(/|$) $binary_remote_addr;
}
limit_req_zone $hima_auth_client zone=hima_auth:10m rate=6r/m;
limit_req_zone $hima_api_client zone=hima_api:10m rate=10r/s;
server {
    listen 80;
    server_name hima.example;
    access_log off;
    error_log /var/log/nginx/hima-api-error.log crit;
    return 308 https://hima.example$request_uri;
}

server {
    listen 443 ssl;
    server_name hima.example;
    ssl_certificate /etc/letsencrypt/live/hima.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hima.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    root /opt/hima/current/frontend/dist;
    index index.html;
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/x-icon ico;
        font/woff woff;
        font/woff2 woff2;
    }

    # Includes bare /api and /auth; never rewrite these to the SPA.
    location ~ ^/(api|auth)(/|$) {
        limit_req zone=hima_auth burst=5 nodelay;
        limit_req zone=hima_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_cache off;
        # Callback URLs contain authorization codes. Do not log them.
        access_log off;
        error_log /var/log/nginx/hima-api-error.log crit;
        client_max_body_size 3m;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # Any location-level add_header disables inheritance of ALL server headers.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
